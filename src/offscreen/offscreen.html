<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AeroRecord Offscreen Pipeline</title>
  <style>
    body { margin: 0; padding: 0; }
    #tabVideo, #cropCanvas {
      position: fixed;
      top: -9999px;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <video id="tabVideo" autoplay muted playsinline></video>
  <canvas id="cropCanvas"></canvas>
  <script type="module" src="offscreen.js"></script>
</body>
</html>
